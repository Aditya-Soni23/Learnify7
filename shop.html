<head>

  <title>Productivity Shop</title>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0a0a;
      margin: 0;
      padding: 20px;
      color: #eee;
    }

    .coin-balance {
      position: fixed;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      color: #000;
      z-index: 1000;
    }

    .home-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff5ac0, #ffea00);
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    h1 {
      text-align: center;
      margin-top: 80px;
    }

    .section-title {
      font-size: 22px;
      margin: 40px 0 20px;
      border-left: 5px solid #ff5e62;
      padding-left: 10px;
    }

    .shop-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* 🔥 Always 2 per row */
  gap: 30px;
  max-width: 1200px;
  margin: 0 auto;
}

    .pack-box {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .pack-box img {
      width: 100%;
    }

    .buy-overlay {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      height: 40px;
      background: rgba(0,0,0,0.6);
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.3);
      overflow: hidden;
    }

    .buy-overlay span {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      z-index: 2;
    }

    .buy-overlay .fill {
      position: absolute;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      transition: 0.5s;
    }

    .pack-box:hover .fill {
      width: 100%;
    }

    .history {
      margin-top: 60px;
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 15px;
    }
  </style>
</head>
<body>

<section class="history">
  <h2>🛒 Purchase History</h2>

</section>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import { getDatabase, ref, get, update, push, onValue } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
  
  /* ================= FIREBASE ================= */
  
  const firebaseConfig = {
    apiKey: "AIzaSyBKQJki3JUr5pDhgOxOQRmXpOY7-gOj2Bk",
    authDomain: "learnify-ada08.firebaseapp.com",
    databaseURL: "https://learnify-ada08-default-rtdb.firebaseio.com",
    projectId: "learnify-ada08",
    storageBucket: "learnify-ada08.appspot.com",
    messagingSenderId: "380617329082",
    appId: "1:380617329082:web:c2242ea09e6f78f1f73583"
  };
  
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  /* ================= MANUAL TIER ================= */
  
  const CURRENT_TIER = "Gold"; // 🔥 CHANGE HERE ONLY
  
  const userRef = ref(db, "users/aditya");
  const balanceRef = ref(db, "users/aditya/balance");
  const purchasesRef = ref(db, "users/aditya/shopPurchases");
  
  const balanceEl = document.getElementById("coinBalance");
  const historyList = document.getElementById("historyList");
  
  /* ================= FULL TIER DATA ================= */
  
  const allTiers = [
    { name: "Copper", yt:["10","15","20","30","60"], game:["15","20","25","35","65"], val:["35","65","45","15"] },
    { name: "Iron", yt:["20","30","40","60","120"], game:["30","40","50","70","130"], val:["70","130","90","30"] },
    { name: "Bronze", yt:["40","60","80","120","240"], game:["60","80","100","140","260"], val:["140","260","180","60"] },
    { name: "Silver", yt:["80","120","150","250","500"], game:["120","150","200","300","500"], val:["300","500","350","120"] },
    { name: "Gold", yt:["150","250","300","500","1000"], game:["250","300","400","550","1000"], val:["550","1000","720","250"] },
    { name: "Platinum", yt:["320","500","650","1000","2000"], game:["500","640","800","1100","2000"], val:["1100","2100","1500","500"] },
    { name: "Emerald", yt:["640","1000","1300","2000","4000"], game:["1000","1300","1600","2250","4000"], val:["2250","4000","3000","1000"] },
    { name: "Diamond", yt:["1500","2000","2500","4000","8000"], game:["2000","2500","3000","4500","8000"], val:["4500","8000","6000","2000"] },
    { name: "Netherite", yt:["2500","4000","5000","8000","15000"], game:["4000","5000","6500","9000","16000"], val:["9000","16000","12000","4000"] },
    { name: "Immortal", yt:["5000","8000","10000","15000","30000"], game:["7500","10000","13000","20000","35000"], val:["20000","35000","25000","8000"] }
  ];
  
  /* ================= APPLY PRICES ================= */
  
  const tierData = allTiers.find(t => t.name === CURRENT_TIER);
  
  if (!tierData) {
    console.error("Tier not found:", CURRENT_TIER);
  } else {
    document.querySelectorAll(".buy-overlay").forEach(box => {
      const type = box.dataset.type;
      const index = parseInt(box.dataset.index);
  
      if (!tierData[type]) return;
  
      const price = parseInt(tierData[type][index]);
      box.dataset.price = price;
  
      box.querySelector(".price-text").innerHTML =
        `${box.dataset.name} – ${price} 🪙`;
    });
  }
  
  /* ================= LIVE BALANCE ================= */
  
  onValue(balanceRef, (snap) => {
    if (snap.exists()) {
      balanceEl.innerText = snap.val() + " 🪙";
    }
  });
  
  /* ================= LOAD PURCHASE HISTORY ================= */
  
  onValue(purchasesRef, (snap) => {
    historyList.innerHTML = "";
  
    if (!snap.exists()) return;
  
    snap.forEach(child => {
      const data = child.val();
      const li = document.createElement("li");
      li.textContent = `${data.item} - ${data.cost} 🪙 (${data.date})`;
      historyList.appendChild(li);
    });
  });
  
  /* ================= BUY FUNCTION ================= */
  
  window.buyItem = async function(item, cost) {
  
    cost = parseInt(cost); // 🔥 FIX STRING ISSUE
  
    const snapshot = await get(userRef);
    const data = snapshot.val();
    const currentBalance = data.balance || 0;
  
    if (currentBalance >= cost) {
  
      await update(userRef, {
        balance: currentBalance - cost
      });
  
      await push(purchasesRef, {
        item: item,
        cost: cost,
        date: new Date().toLocaleString()
      });
  
      alert("Purchased ✅");
  
    } else {
      alert("Not enough coins ❌");
    }
  };
  
  </script>
