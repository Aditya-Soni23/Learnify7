<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberBank 2077 - National Growth</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* Critical Overload Flash */
.nuke-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: white;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
}

/* Glitch Animation for the Card */
@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-5px, 5px); }
    40% { transform: translate(-5px, -5px); }
    60% { transform: translate(5px, 5px); }
    80% { transform: translate(5px, -5px); }
    100% { transform: translate(0); }
}

.glitch-active {
    animation: glitch 0.2s infinite;
    filter: hue-rotate(90deg) brightness(1.5);
}
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --neon-green: #22c55e;
            --neon-pink: #ff0055;
            --bg-dark: #060b14;
            --card-bg: rgba(20, 30, 48, 0.8);
            --text-main: #f8fafc;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            background-color: var(--bg-dark);
        }

        /* High-End Background Setup */
        #city-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('city.png'); /* YOUR IMAGE */
            background-size: cover;
            background-position: center;
            filter: brightness(0.4) contrast(1.1);
            z-index: -2;
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Glow effect on the edges of the screen */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 100px rgba(0, 242, 254, 0.2);
            pointer-events: none;
            z-index: 0;
        }

        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            perspective: 1000px;
        }

        /* Glassmorphism Card with Neon Border */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 30px;
            width: 450px;
            text-align: center;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.1), inset 0 0 15px rgba(255, 255, 255, 0.05);
            opacity: 0; /* Starts hidden for intro animation */
            transform: translateZ(-100px) rotateX(10deg);
        }

        h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #fff, var(--primary), #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            margin-bottom: 0.5rem;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* The Multiplier Display - Massive Upgrade */
        .growth-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .growth-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 180deg at 50% 50%, transparent 0%, var(--primary) 25%, transparent 50%);
            animation: rotateGlow 4s linear infinite;
            opacity: 0.3;
            z-index: -1;
        }

        @keyframes rotateGlow {
            100% { transform: rotate(360deg); }
        }

        .stat-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7; color: var(--primary); }

        .growth-display {
            font-size: 4.5rem;
            font-weight: 900;
            margin: 10px 0;
            color: #fff;
            text-shadow: 0 0 10px var(--primary), 0 0 30px var(--primary);
            font-family: 'Courier New', monospace; /* Tech feel */
        }

        /* Input and Button Styling */
        .controls { margin-top: 2rem; }

        input {
            width: 90%;
            padding: 15px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            text-align: center;
            transition: 0.3s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        button {
            width: 90%;
            padding: 15px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, var(--secondary), #00ff88);
            color: var(--bg-dark);
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        button:hover {
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
            transform: translateY(-2px);
        }

        /* Pure CSS Donation Animation elements */
        .coin-fly {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            z-index: 100;
        }
        /* Home Button Styling */
.home-btn {
    position: fixed;
    top: 25px;
    left: 25px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: rgba(0, 242, 254, 0.05);
    border: 1px solid var(--primary);
    color: var(--primary);
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.8rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 1000;
    transition: all 0.3s ease;
    /* Clipped corner effect */
    clip-path: polygon(0 0, 100% 0, 100% 70%, 85% 100%, 0 100%);
}

.home-btn:hover {
    background: var(--primary);
    color: var(--bg-dark);
    box-shadow: 0 0 20px var(--primary);
    transform: translateY(-2px);
}

.home-icon {
    font-size: 1.2rem;
}

/* Optional: Mobile adjustment */
@media (max-width: 600px) {
    .home-text { display: none; }
    .home-btn { padding: 10px; clip-path: none; border-radius: 50%; }
}

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="city-bg"></div>
    <a href="index.html" class="home-btn">
        <span class="home-icon">⌂</span>
        <span class="home-text">RETURN TO HUB</span>
    </a>
    <div id="particles-js"></div> <div class="main-wrapper">
        <div class="container" id="main-card">
            <h1>CyberBank</h1>
            <p style="font-size:0.9rem; opacity:0.6;">Aditya's Terminal</p>
            
            <div class="growth-card">
                <div class="stat-label">Country Growth Multiplier</div>
                <div class="growth-display" id="multiplier">0.0x</div>
                <div class="stat-label">Total Treasury: <span id="total-funds" style="color:white;">0</span></div>
            </div>

            <p>Available Balance: <strong id="user-balance" style="color:var(--neon-green)">0</strong> <span style="font-size:0.8rem; opacity:0.7">CC</span></p>
            
            <div class="controls">
                <input type="number" id="donate-amount" placeholder="Enter Contribution">
                <button onclick="donate()" id="donate-btn">Execute Donation</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE SETUP (Unaltered) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBKQJki3JUr5pDhgOxOQRmXpOY7-gOj2Bk",
            authDomain: "learnify-ada08.firebaseapp.com",
            databaseURL: "https://learnify-ada08-default-rtdb.firebaseio.com",
            projectId: "learnify-ada08",
            storageBucket: "learnify-ada08.appspot.com",
            messagingSenderId: "380617329082",
            appId: "1:380617329082:web:c2242ea09e6f78f1f73583",
            measurementId: "G-DT4WG6622N"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const userRef = db.ref('users/aditya');
        const growthRef = db.ref('countryGrowth');

        // --- 2. THE AWESOME ANIMATIONS (GSAP & THREE.js) ---

        // A. Intro Animation (Card sliding in from 3D space)
        window.addEventListener('load', () => {
            gsap.to("#main-card", {
                duration: 1.5,
                opacity: 1,
                translateZ: 0,
                rotateX: 0,
                ease: "power4.out",
                delay: 0.5
            });
            initThreeJSBackground();
        });

        // B. Three.js Starfield Background (Overlays city.png)
        function initThreeJSBackground() {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('particles-js').appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < 5000; i++) {
                vertices.push(THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000));
            }
            geometry.setAttribute('position', THREE.Float32BufferAttribute(vertices, 3));
            const particles = new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0x00f2fe, size: 2 }));
            scene.add(particles);

            camera.position.z = 1;

            function animate() {
                requestAnimationFrame(animate);
                particles.rotation.x += 0.0005;
                particles.rotation.y += 0.001;
                renderer.render(scene, camera);
            }
            animate();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // C. Update Multiplier Animation (Rolling numbers)
        let cachedMultiplier = 0;
        function animateMultiplier(newVal) {
            const cont = { val: cachedMultiplier };
            gsap.to(cont, {
                val: newVal,
                duration: 2,
                ease: "expo.out",
                onUpdate: () => {
                    document.getElementById('multiplier').innerText = cont.val.toFixed(1) + "x";
                }
            });
            cachedMultiplier = newVal;
        }

        // D. High-End Donation Success Animation
        function runDonationVisuals() {
    const btn = document.getElementById('donate-btn');
    const card = document.getElementById('main-card');
    
    // 1. Create the Nuke Flash Overlay
    const flash = document.createElement('div');
    flash.className = 'nuke-overlay';
    document.body.appendChild(flash);

    // 2. Timeline for the "Impact"
    const tl = gsap.timeline();

    // Sudden Whiteout & Card Glitch
    tl.to(flash, { opacity: 1, duration: 0.05 })
      .add(() => card.classList.add('glitch-active'))
      .to(flash, { opacity: 0, duration: 0.8, ease: "power2.out" })
      .add(() => card.classList.remove('glitch-active'), "-=0.5");

    // 3. Heavy Camera/World Shake
    gsap.fromTo("body", 
        { x: -20, y: -20 }, 
        { x: 0, y: 0, duration: 0.1, repeat: 10, ease: "rough({ strength: 2, points: 20, template: none, taper: none, randomize: true })" }
    );

    // 4. Expansion Shockwave (The Blue Ring)
    const ring = document.createElement('div');
    ring.style.cssText = `
        position: fixed; top: 50%; left: 50%;
        width: 10px; height: 10px;
        border: 10px solid var(--primary);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        z-index: 98;
        pointer-events: none;
    `;
    document.body.appendChild(ring);
    
    gsap.to(ring, {
        width: 3000,
        height: 3000,
        borderWidth: 0,
        opacity: 0,
        duration: 1.2,
        ease: "expo.out",
        onComplete: () => ring.remove()
    });

    // 5. Massive Particle Blast (Debris)
    const icons = ['🔥', '⚡', '💎', '01', '10', '☢️'];
    for (let i = 0; i < 40; i++) {
        const el = document.createElement('div');
        el.className = 'coin-fly';
        el.innerText = icons[Math.floor(Math.random() * icons.length)];
        el.style.left = "50%";
        el.style.top = "50%";
        el.style.fontSize = Math.random() * 30 + 20 + "px";
        document.body.appendChild(el);

        gsap.to(el, {
            x: (Math.random() - 0.5) * 1200,
            y: (Math.random() - 0.5) * 1200,
            rotation: Math.random() * 1000,
            opacity: 0,
            scale: 0.1,
            duration: 2,
            ease: "power4.out",
            onComplete: () => el.remove()
        });
    }

    // 6. Impact Text
    const impactText = document.createElement('div');
    impactText.innerText = "TREASURY OVERLOAD";
    impactText.style.cssText = "position:fixed; top:40%; left:50%; transform:translate(-50%, -50%); font-size:4rem; font-weight:900; color:white; text-shadow:0 0 20px var(--primary); z-index:1000; pointer-events:none;";
    document.body.appendChild(impactText);
    
    gsap.fromTo(impactText, { scale: 0, opacity: 0 }, { scale: 1.5, opacity: 1, duration: 0.3, ease: "back.out(2)" });
    gsap.to(impactText, { opacity: 0, y: -100, duration: 1, delay: 0.5, onComplete: () => impactText.remove() });
    // Add this line inside runDonationVisuals() to make the home button glitch too!
gsap.fromTo(".home-btn", { x: -5 }, { x: 0, duration: 0.05, repeat: 10, yoyo: true });
}
        // --- 3. LOGIC & DATA (Unaltered Core) ---

        function initDataListeners() {
            // Watch Aditya's balance
            userRef.child('balance').on('value', (snapshot) => {
                const bal = snapshot.val() || 0;
                document.getElementById('user-balance').innerText = bal.toLocaleString();
                // Little pulse animation on balance change
                gsap.fromTo("#user-balance", {color:'#fff'}, {color:'#22c55e', duration: 0.5});
            });

            // Watch Country Growth
            growthRef.child('funds').on('value', (snapshot) => {
                const funds = snapshot.val() || 0;
                document.getElementById('total-funds').innerText = funds.toLocaleString();
                
                // Calculate Multiplier (100 coins = 1x)
                const mult = parseFloat((funds / 100).toFixed(1));
                animateMultiplier(mult); // Use the GSAP rolling number animation
            });
        }

        async function donate() {
            const amountInput = document.getElementById('donate-amount');
            const amount = parseInt(amountInput.value);

            if (isNaN(amount) || amount <= 0) {
                gsap.to(amountInput, { x: 10, duration: 0.1, yoyo: true, repeat: 3 }); // Shake input red
                amountInput.style.borderColor = 'var(--neon-pink)';
                setTimeout(()=> amountInput.style.borderColor = 'rgba(255,255,255,0.1)', 1000);
                return;
            }

            // Transaction Logic
            const snapshot = await userRef.child('balance').once('value');
            const currentBalance = snapshot.val() || 0;

            if (amount > currentBalance) {
                alert("Insufficient CryptoCredits!");
                return;
            }

            // Trigger visual sequence immediately for responsiveness
            runDonationVisuals();

            // Perform Database Updates
            await userRef.child('balance').set(currentBalance - amount);
            const growthSnap = await growthRef.child('funds').once('value');
            const currentGrowth = growthSnap.val() || 0;
            await growthRef.child('funds').set(currentGrowth + amount);

            amountInput.value = '';
        }

        // Start Everything
        initDataListeners();

    </script>
</body>
</html>
