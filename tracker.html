  body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #faf5fa;
    color: #222;
  }

  /* Top bar */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgb(193, 193, 8);
    padding: 15px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
  }

  /* Day card */
  .day-card {
    background: white;
    margin: 18px;
    padding: 15px 18px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(225, 241, 1, 0.06);
  }

  .day-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  /* Chapter row */
  .chapter {
    display: flex;
    align-items: center;
    margin: 8px 0;
  }

  .chapter input {
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #999;
    margin-right: 12px;
    cursor: pointer;
    transition: 0.2s;
  }

  .chapter input:checked {
    background: #4caf50;
    border-color: #4caf50;
    transform: scale(1.1);
  }

  .chapter span {
    font-size: 15px;
    line-height: 1.4;
  }

  .chapter input:checked + span {
    opacity: 0.55;
    text-decoration: line-through;
  }

  /* Toast popup */
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #222;
    color: white;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 15px;
    opacity: 0;
    transform: translateY(20px);
    transition: 0.3s;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  /* Grid layout for day cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 18px;
  padding: 18px;
}

/* Remove margin since grid handles spacing */
.day-card {
  margin: 0;
}
.motivator-btn {
  background: black;
  color: white;
  border: 1px solid #333;
  padding: 10px 18px;
  font-size: 15px;
  border-radius: 8px;
  cursor: pointer;
  margin-left: 100px;
}

.motivator-btn:hover {

}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.modal-content {
  width: 80%;
  max-width: 900px;
  border-radius: 12px;
  overflow: hidden;
}

.modal video {
  width: 100%;
  height: auto;
}
.home{

    color: white;
    border-radius: 5px;
    margin-left: 100px;

/* ================= UI ================= */
const content = document.getElementById("content");
const toast = document.getElementById("toast");
const coinSound = document.getElementById("coinSound");

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1500);
}

/* ================= BALANCE ================= */
balanceRef.on("value", snap => {
  document.getElementById("coinBalance").textContent = snap.val() || 0;
});
const trackerRef = db.ref("users/aditya/tracker");

/* ================= RENDER ================= */
days.forEach((day, dIndex) => {
  const card = document.createElement("div");
  card.className = "day-card";

  const title = document.createElement("div");
  title.className = "day-title";
  title.textContent = day.title;
  card.appendChild(title);

  day.chapters.forEach((ch, cIndex) => {
    const row = document.createElement("div");
    row.className = "chapter";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";

    const key = `day${dIndex}_ch${cIndex}`;
    trackerRef.child(key).on("value", snap => {
  checkbox.checked = snap.val() === true;
});


checkbox.onchange = () => {
  balanceRef.get().then(snap => {
    let balance = snap.val() || 0;

    if (checkbox.checked) {
      balance += 1000;
      trackerRef.child(key).set(true);   // ✅ save tick
      showToast("+1000 Coins 🪙");
    } else {
      balance -= 1000;
      trackerRef.child(key).remove();    // ❌ remove tick
      showToast("-1000 Coins 🪙");
    }

    balanceRef.set(balance);
    coinSound.currentTime = 0;
    coinSound.play();
  });
};


    const text = document.createElement("span");
    text.textContent = ch;

    row.appendChild(checkbox);
    row.appendChild(text);
    card.appendChild(row);
  });

  content.appendChild(card);
});
