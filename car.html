<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Car System Pro</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background: #000;
            color: white;
        }

        /* 🎥 HIGH-QUALITY VIDEO RENDERING */
        video, #garageView {
            position: fixed;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
            image-rendering: high-quality; 
            filter: contrast(1.1) brightness(0.9);
        }
        video {
  width: 100vw;
  height: 100vh;
}

        #garageView {
            background: url('garage.png') center/cover no-repeat;
            display: none;
        }

        /* 🎬 SMOOTH FADE LAYER */
        #fadeLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
        }

        .fade-active { opacity: 1 !important; }

        .balance {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #c9a227, #ffd700);
            color: black;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            z-index: 5;
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }

        .panel {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 25px;
            border: 1px solid rgba(255,215,0,0.3);
            text-align: center;
            z-index: 5;
        }

        .fuel-container {
            height: 18px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
            border: 1px solid #444;
        }

        .fuel-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #c9a227);
            transition: width 1s linear; /* Smooth movement */
        }

        .btn {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffd700, #c9a227);
            color: black;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        .damage-text { color: #ff3e3e; font-size: 22px; font-weight: bold; margin-bottom: 15px; }
        video, #garageView {
  /* ... your existing code ... */
  
  /* Forces the browser to use the highest quality scaling */
  image-rendering: -webkit-optimize-contrast; 
  image-rendering: crisp-edges;
  
  /* Ensures the video doesn't stretch and lose its aspect ratio */
  object-fit: cover; 
  
  /* Subtle sharpening via contrast */
  filter: contrast(1.05) brightness(0.95); 
  
  /* Hardware acceleration (moves rendering to the GPU) */
  transform: translateZ(0);
  backface-visibility: hidden;
}
.home-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(0, 0, 0, 0.5);
    color: #ffd700; /* Gold text */
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    z-index: 100;
    border: 1px solid rgba(255, 215, 0, 0.4);
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
}

.home-btn:hover {
    background: #ffd700;
    color: black;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    transform: scale(1.05);
}
    </style>
</head>
<body>

<div id="fadeLayer"></div>
<div class="home-btn" onclick="goHome()">🏠 Home</div>
<div class="balance">💰 <span id="balance">0</span></div>

<video id="runningVideo" src="running.mp4" autoplay loop muted></video>
<video id="damagedVideo" src="damaged.mp4" loop muted style="display:none;"></video>
<div id="garageView"></div>

<div class="panel" id="panel"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getDatabase, ref, get, update, onValue } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
      apiKey: "AIzaSyBKQJki3JUr5pDhgOxOQRmXpOY7-gOj2Bk",
      authDomain: "learnify-ada08.firebaseapp.com",
      databaseURL: "https://learnify-ada08-default-rtdb.firebaseio.com",
      projectId: "learnify-ada08",
      storageBucket: "learnify-ada08.appspot.com",
      messagingSenderId: "380617329082",
      appId: "1:380617329082:web:c2242ea09e6f78f1f73583",
      measurementId: "G-DT4WG6622N"
    };

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const userRef = ref(db, "users/aditya");

let car = { fuel: 0, damaged: false, lastUpdate: Date.now() };
let currentView = "running"; 
let isTransitioning = false;

// 1. SYNC INITIAL DATA & BALANCE
onValue(userRef, (snap) => {
    const data = snap.val();
    if (!data) return;
    document.getElementById("balance").innerText = data.balance || 0;
    
    // Only update local car object if not currently "driving" to prevent jitter
    if (!car.fuel || Math.abs(car.fuel - data.car.fuel) > 2) {
        car = data.car;
    }
});

// 2. THE HEARTBEAT (Runs every 1 second)
// 2. THE HEARTBEAT (Runs every 1 second)
setInterval(() => {
    if (car.damaged || isTransitioning || car.fuel <= 0) return;

    // 1 Liter lasts 48 minutes (2880 seconds)
    // So, 1 / 2880 = 0.00034722... liters per second
    const drainRatePerSecond = 1 / (48 * 60); 

    // Subtract the drain rate for 1 elapsed second
    car.fuel = Math.max(0, car.fuel - drainRatePerSecond);

    if (car.fuel <= 0) {
        car.fuel = 0;
        car.damaged = true;
        syncToFirebase();
        triggerView("damaged");
    }

    updateUI();
}, 1000);

// Sync to Firebase every 5 seconds to save bandwidth/quota
setInterval(syncToFirebase, 5000);

async function syncToFirebase() {
    await update(userRef, { 
        "car/fuel": car.fuel, 
        "car/damaged": car.damaged,
        "car/lastUpdate": Date.now() 
    });
}

// 3. VIEW CONTROLLER (With Fades)
async function triggerView(newView) {
    if (currentView === newView || isTransitioning) return;
    isTransitioning = true;

    const fade = document.getElementById("fadeLayer");
    fade.classList.add("fade-active");

    setTimeout(() => {
        currentView = newView;
        
        // Toggle Elements
        document.getElementById("runningVideo").style.display = (newView === "running") ? "block" : "none";
        document.getElementById("damagedVideo").style.display = (newView === "damaged") ? "block" : "none";
        document.getElementById("garageView").style.display = (newView === "garage") ? "block" : "none";
        
        updateUI();
        fade.classList.remove("fade-active");
        isTransitioning = false;
    }, 600);
}

// 4. UI RENDERER
function updateUI() {
    const panel = document.getElementById("panel");
    
    if (car.damaged && currentView !== "garage") {
        panel.innerHTML = `
            <div class="damage-text">⚠️ ENGINE FAILURE</div>
            <button class="btn" onclick="window.goToGarage()">TOW TO GARAGE</button>
        `;
    } else if (currentView === "garage") {
        panel.innerHTML = `
            <div style="margin-bottom:10px">🛠️ GARAGE SERVICES</div>
            <button class="btn" onclick="window.repairNow()">REPAIR & START (3000)</button>
            <button class="btn" style="background:#333; color:white;" onclick="window.exitGarage()">EXIT</button>
        `;
    } else {
        const percent = (car.fuel / 90) * 100;
        panel.innerHTML = `
            <div class="fuel-container"><div class="fuel-bar" style="width:${percent}%"></div></div>
            <div style="font-size: 14px; color: #ffd700;">${car.fuel.toFixed(2)}L / 90.00L</div>
            <button class="btn" onclick="window.addFuel(10)">ADD 10L (100)</button>
        `;
    }
}

// 5. WINDOW ACTIONS
window.goToGarage = () => triggerView("garage");
window.exitGarage = () => triggerView(car.damaged ? "damaged" : "running");

window.addFuel = async (liters) => {
    const snap = await get(userRef);
    const bal = snap.val().balance;
    if (bal < liters * 10) return alert("Not enough coins!");
    
    car.fuel = Math.min(90, car.fuel + liters);
    await update(userRef, { 
        balance: bal - (liters * 10),
        "car/fuel": car.fuel 
    });
    updateUI();
};

window.repairNow = async () => {
    const snap = await get(userRef);
    const bal = snap.val().balance;
    if (bal < 3000) return alert("Repair costs 3000!");

    // Set local state immediately for responsiveness
    car.damaged = false;
    car.fuel = 1.0; 

    await update(userRef, {
        balance: bal - 3000,
        car: { fuel: 1.0, damaged: false, lastUpdate: Date.now() }
    });

    triggerView("running");
};

// Initial Load
updateUI();
window.goHome = function() {
    const fade = document.getElementById("fadeLayer");
    
    // Trigger the black fade-out
    fade.classList.add("fade-active");

    // Wait for the animation (600ms) then redirect
    setTimeout(() => {
        window.location.href = "index.html"; // Change this to your actual home filename
    }, 600);
};
</script>
</body>
</html>
